<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plantilla</title>
    <meta name="description" content="Esto es la descripción de mi página web">
    <meta name="keywords" content="html, ejercicio, ejercicio1, ejemplo">
    <meta name="author" content="Juan Profesor">
    <meta name="application-name" content="Plantilla.html">
    <meta name="generator" content="VSCode">
</head>
<body>
<h1>Formulario estrucuturado</h1>


    <form action="#" method="post" autocomplete="on">
      <fieldset>
        <legend>Datos personales</legend>

        <div>
          <label for="nombre">Nombre</label>
          <input type="text" id="nombre" name="nombre" required autocomplete="given-name" />
        </div>

        <div>
          <label for="apellidos">Apellidos</label>
          <input type="text" id="apellidos" name="apellidos" required autocomplete="family-name" />
        </div>

        <div>
          <label for="dni">DNI</label>
          <input
            type="text"
            id="dni"
            name="dni"
            required
            inputmode="text"
            aria-describedby="dni-ayuda"
          />
          <small id="dni-ayuda">Introduce tu DNI (formato estándar).</small>
        </div>
      </fieldset>

      <fieldset>
        <legend>Datos de conexión</legend>

        <div>
          <label for="usuario">Nombre de usuario</label>
          <input type="text" id="usuario" name="usuario" required autocomplete="username" />
        </div>

        <div>
          <label for="password">Contraseña</label>
          <input
            type="password"
            id="password"
            name="password"
            required
            autocomplete="new-password"
          />
        </div>

        <div>
          <label for="password2">Repite la contraseña</label>
          <input
            type="password"
            id="password2"
            name="password2"
            required
            autocomplete="new-password"
          />
        </div>
      </fieldset>

      <button type="submit">Enviar</button>
    </form>
  </main>
</body>
</html>
